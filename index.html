<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRPMAN SHADOW WATCH // POWERED BY $XMEME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --lime-main: #00ff00;
            --lime-dim: #004400;
            --glass-bg: rgba(0, 10, 0, 0.94);
            --alert-red: #ff0000;
        }

        body {
            margin: 0; overflow: hidden; background-color: #000;
            font-family: 'Rajdhani', sans-serif; color: var(--lime-main);
            touch-action: none; user-select: none;
        }

        /* --- SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease-out;
        }
        
        #splash-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            display: none; /* Hidden until triggered */
        }

        #boot-btn {
            z-index: 10000;
            background: #000; border: 2px solid var(--lime-main);
            color: var(--lime-main); padding: 15px 30px;
            font-family: 'Orbitron', sans-serif; font-size: 16px; letter-spacing: 4px;
            cursor: pointer; box-shadow: 0 0 20px var(--lime-main);
            animation: pulse-green 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 10px var(--lime-main); }
            50% { box-shadow: 0 0 30px var(--lime-main), inset 0 0 10px var(--lime-main); }
            100% { box-shadow: 0 0 10px var(--lime-main); }
        }

        .fade-out { opacity: 0; pointer-events: none; }

        /* --- MAIN APP --- */
        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        /* GLITCH HEADER */
        .glitch-wrapper { position: relative; display: inline-block; }
        .glitch {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.5rem;
            color: var(--lime-main); position: relative; letter-spacing: 2px;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch::before {
            left: 2px; text-shadow: -1px 0 #ff0000; clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -1px 0 #0000ff; clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 31px, 0); }
            20% { clip: rect(65px, 9999px, 89px, 0); }
            40% { clip: rect(18px, 9999px, 46px, 0); }
            60% { clip: rect(80px, 9999px, 10px, 0); }
            80% { clip: rect(4px, 9999px, 87px, 0); }
            100% { clip: rect(35px, 9999px, 7px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(40px, 9999px, 14px, 0); }
            40% { clip: rect(2px, 9999px, 67px, 0); }
            60% { clip: rect(35px, 9999px, 8px, 0); }
            80% { clip: rect(90px, 9999px, 20px, 0); }
            100% { clip: rect(15px, 9999px, 55px, 0); }
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; color: var(--lime-main);
            letter-spacing: 3px; margin-top: -5px; opacity: 0.8; text-shadow: 0 0 5px var(--lime-main);
        }

        /* TOAST */
        #toast {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0, 50, 0, 0.95); border: 1px solid var(--lime-main);
            color: var(--lime-main); padding: 12px 24px; border-radius: 4px;
            font-family: 'Share Tech Mono'; font-size: 14px; letter-spacing: 1px;
            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
            box-shadow: 0 0 30px var(--lime-main); font-weight: bold;
        }
        .toast-show { opacity: 1 !important; }

        /* HUD LAYOUT */
        #hud-top {
            position: absolute; top: 0; left: 0; right: 0; z-index: 20;
            background: linear-gradient(to bottom, #000 40%, transparent);
            padding: 15px; pointer-events: none;
            display: flex; flex-direction: column; gap: 10px;
        }
        .header-section { text-align: center; pointer-events: auto; margin-bottom: 5px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; pointer-events: auto; }
        .stat-box {
            background: rgba(0, 20, 0, 0.8); border: 1px solid var(--lime-dim);
            padding: 8px; border-radius: 4px; backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center;
        }
        .price-text { font-family: 'Share Tech Mono', monospace; font-size: 1.4rem; font-weight: bold; line-height: 1.2; }
        .label-text { font-size: 0.65rem; color: #55aa55; letter-spacing: 1px; font-weight: bold; }
        .source-tag { font-size: 0.55rem; color: #338833; float: right; }

        .connect-btn {
            grid-column: span 2; background: #001100; border: 1px solid var(--lime-main);
            color: var(--lime-main); padding: 12px; font-weight: bold; font-size: 14px;
            letter-spacing: 3px; text-align: center; margin-top: 5px; border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,255,0,0.2); transition: all 0.2s; font-family: 'Orbitron', sans-serif;
        }
        .connect-btn:active { background: var(--lime-main); color: black; box-shadow: 0 0 20px var(--lime-main); }

        #hud-bottom {
            position: absolute; bottom: 0; left: 0; right: 0; height: 60vh; z-index: 30;
            display: flex; flex-direction: column; pointer-events: none;
        }
        #command-deck {
            flex-grow: 1; background: var(--glass-bg); border-top: 2px solid var(--lime-dim);
            backdrop-filter: blur(12px); display: flex; flex-direction: column;
            pointer-events: auto; border-radius: 16px 16px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }

        .tab-bar { display: flex; border-bottom: 1px solid var(--lime-dim); height: 50px; }
        .tab-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 13px; background: rgba(0,20,0,0.4); color: #00aa00;
            border-right: 1px solid var(--lime-dim); letter-spacing: 1px; font-family: 'Orbitron', sans-serif;
        }
        .tab-btn.active { background: #001100; color: var(--lime-main); border-bottom: 3px solid var(--lime-main); text-shadow: 0 0 10px var(--lime-main); }

        .view-panel { display: none; flex-direction: column; height: 100%; padding: 0; position: relative; }
        .view-panel.active { display: flex; }

        .pause-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; border-bottom: 1px solid var(--lime-dim); background: rgba(0,0,0,0.5);
        }
        .pause-btn {
            background: #002200; border: 1px solid var(--lime-main); color: var(--lime-main);
            padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; font-family: 'Share Tech Mono';
        }
        .paused-mode { background: #442200 !important; border-color: #ffaa00 !important; color: #ffaa00 !important; }

        #feed { flex-grow: 1; overflow-y: auto; touch-action: pan-y; padding-bottom: 20px; }

        .tx-row { padding: 12px; border-bottom: 1px solid var(--lime-dim); display: flex; flex-direction: column; gap: 6px; }
        .row-top { display: flex; justify-content: space-between; align-items: center; }
        .tag-pill { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-left: 6px; font-family: 'Share Tech Mono'; }
        .tag-exchange { background: #002244; color: #00ffff; border: 1px solid #004488; }
        .tag-whale { background: #443300; color: #ffaa00; border: 1px solid #664400; }

        .btn-row { display: flex; gap: 8px; margin-top: 4px; }
        .action-btn {
            flex: 1; padding: 10px 0; text-align: center; border-radius: 2px;
            font-size: 11px; font-weight: bold; font-family: 'Share Tech Mono';
            background: #001100; color: #008800; border: 1px solid var(--lime-dim);
        }
        .action-btn:active { background: var(--lime-main); color: black; }
        .entity-name { color: #ffcc00; font-weight: bold; }

    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <video id="splash-video" playsinline>
            <source src="https://ipfs.filebase.io/ipfs/QmVMYvMffwSXPJyuNz3CAW8V6rS1wViWQjPHdzPGofb7Ux" type="video/mp4">
        </video>
        <button id="boot-btn" onclick="bootSystem()">SYSTEM BOOT</button>
    </div>

    <div id="toast">NOTIFICATION</div>
    <div id="canvas-container"></div>

    <!-- MAIN APP HUD -->
    <div id="hud-top">
        <!-- BRANDING SECTION -->
        <div class="header-section">
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="XRPMAN SHADOW WATCH">XRPMAN SHADOW WATCH</h1>
            </div>
            <div class="subtitle">POWERED BY $XMEME</div>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <div class="label-text">XRP / USD <span id="price-source" class="source-tag">SCANNING...</span></div>
                <div id="price-display" class="price-text">---</div>
            </div>
            <div class="stat-box text-right">
                <div class="label-text">LEDGER INDEX</div>
                <div id="ledger-display" class="price-text text-green-700">OFFLINE</div>
            </div>
            <button id="connect-main" onclick="toggleConnection()" class="connect-btn">INITIALIZE UPLINK</button>
        </div>
    </div>

    <div id="hud-bottom">
        <div id="command-deck">
            <div class="tab-bar">
                <div class="tab-btn active" onclick="switchView('live')">LIVE FEED</div>
                <div class="tab-btn" onclick="switchView('watch')">WATCHLIST</div>
                <div class="tab-btn" onclick="switchView('case')">EVIDENCE</div>
            </div>

            <!-- LIVE TAB -->
            <div id="view-live" class="view-panel active">
                <div class="pause-bar">
                    <span class="text-[10px] text-green-700 font-bold">VECTOR STREAM</span>
                    <button id="pause-btn" class="pause-btn" onclick="togglePause()">PAUSE STREAM</button>
                </div>
                <div id="feed">
                    <div class="text-center text-green-800 mt-12 font-tech text-xs tracking-widest">
                        AWAITING UPLINK...
                    </div>
                </div>
            </div>

            <!-- WATCH TAB -->
            <div id="view-watch" class="view-panel p-4">
                <div class="flex gap-2 p-2 bg-black/50 border border-green-900 mb-2">
                    <input type="text" id="watch-input" placeholder="Enter rAddress..." class="flex-grow bg-transparent text-white text-xs outline-none font-tech">
                    <button onclick="addWatch()" class="text-green-500 font-bold text-xs uppercase">Track</button>
                </div>
                <div id="watch-list" class="flex-grow overflow-y-auto space-y-1" style="touch-action: pan-y;"></div>
            </div>

            <!-- CASE TAB -->
            <div id="view-case" class="view-panel">
                <div class="flex justify-between p-3 border-b border-green-900 bg-black/20">
                    <span class="text-xs text-green-700">SAVED ANOMALIES</span>
                    <button onclick="exportJSON()" class="text-[10px] text-green-400 border border-green-600 px-3 rounded">EXPORT</button>
                </div>
                <div id="case-list" class="flex-grow overflow-y-auto space-y-1 p-2" style="touch-action: pan-y;"></div>
                <button onclick="clearCases()" class="text-red-500 text-xs py-4 bg-red-900/10 font-bold tracking-widest border-t border-red-900">CLEAR LOCKER</button>
            </div>
        </div>
    </div>

    <script>
        // --- BOOT SEQUENCE ---
        function bootSystem() {
            const vid = document.getElementById('splash-video');
            const btn = document.getElementById('boot-btn');
            
            btn.style.display = 'none'; // Hide button
            vid.style.display = 'block'; // Show video
            vid.volume = 1.0;
            vid.play().catch(e => console.log("Audio Blocked", e));
            
            vid.onended = () => {
                document.getElementById('splash-screen').classList.add('fade-out');
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                }, 1000);
            };
        }

        // --- 3D ENGINE ---
        let scene, camera, renderer, particles;
        const particleCount = 2500;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.03); 
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, -10, 30);
            camera.lookAt(0, 10, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            const pGeo = new THREE.BufferGeometry();
            const pos = [], speeds = [];
            for(let i=0; i<particleCount; i++) {
                pos.push((Math.random()-0.5)*50, (Math.random()-0.5)*10-20, (Math.random()-0.5)*30);
                speeds.push(0.1 + Math.random() * 0.4);
            }
            pGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            pGeo.setAttribute('speed', new THREE.Float32BufferAttribute(speeds, 1));
            
            particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
                color: 0x00ff00, size: 0.4, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
            }));
            scene.add(particles);
            animate();
            
            let startX = 0;
            container.addEventListener('touchmove', e => {
                camera.rotation.z -= (e.touches[0].clientX - startX) * 0.0005;
                startX = e.touches[0].clientX;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = particles.geometry.attributes.position.array;
            const spd = particles.geometry.attributes.speed.array;
            for(let i=0; i<particleCount; i++) {
                pos[i*3+1] += spd[i];
                if(pos[i*3+1] > 30) {
                    pos[i*3+1] = -20;
                    pos[i*3] = (Math.random()-0.5)*50;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            camera.position.x = Math.sin(Date.now()*0.0005)*2;
            renderer.render(scene, camera);
        }

        // --- APP LOGIC ---
        let socket, isConnected = false, watchlist = [], cases = [], priceInterval, isPaused = false;
        const ENTITIES = {
            'rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh': 'GENESIS', 'rh1HPuR9...': 'BITSTAMP',
            'rPVMhWBsfF9iMXYj3aAzJ5NrPxrXz...': 'XRP TIP BOT', 'rLNaPoKeeBJZe2qs6x52yVPZpZ8td4dc6w': 'COINBASE',
            'rEb8TK3gBgk5auZkwc6sHnwrGVJH8DuaLh': 'BINANCE', 'rJb5KsHsDHF1YSnasbwqSagepE8XXAuGh': 'BITSTAMP'
        };

        function toggleConnection() {
            const btn = document.getElementById('connect-main');
            if(isConnected) {
                if(socket) socket.close();
                clearInterval(priceInterval);
                isConnected = false;
                btn.innerText = "INITIALIZE UPLINK";
                btn.style.background = "#001100"; btn.style.color = "#00ff00";
                document.getElementById('price-label').style.color = "#008800";
                showToast("SYSTEM HALTED");
            } else {
                startXRPL();
                startRedundantPriceEngine();
                isConnected = true;
                btn.innerText = "UPLINK ACTIVE";
                btn.style.background = "#00ff00"; btn.style.color = "#000";
                document.getElementById('feed').innerHTML = '';
                showToast("FIREWALL BREACHED");
            }
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('pause-btn');
            if(isPaused) {
                btn.innerText = "RESUME STREAM"; btn.classList.add('paused-mode');
                showToast("STREAM FROZEN");
            } else {
                btn.innerText = "PAUSE STREAM"; btn.classList.remove('paused-mode');
                showToast("STREAM RESUMED");
            }
        }

        const PRICE_SOURCES = [
            { id: 'BINANCE.US', url: 'https://api.binance.us/api/v3/ticker/price?symbol=XRPUSDT', parse: d => parseFloat(d.price) },
            { id: 'COINGECKO', url: 'https://api.coingecko.com/api/v3/simple/price?ids=ripple&vs_currencies=usd', parse: d => d.ripple.usd },
            { id: 'KRAKEN', url: 'https://api.kraken.com/0/public/Ticker?pair=XRPUSD', parse: d => parseFloat(d.result.XXRPZUSD.c[0]) }
        ];

        async function fetchPrice() {
            for (let source of PRICE_SOURCES) {
                try {
                    const c = new AbortController();
                    setTimeout(() => c.abort(), 2000); 
                    const res = await fetch(source.url, { signal: c.signal });
                    const data = await res.json();
                    const price = source.parse(data);
                    if (price && !isNaN(price)) { updatePriceDisplay(price, source.id); return; }
                } catch (e) {}
            }
            document.getElementById('price-display').innerText = "ERR";
        }

        function updatePriceDisplay(price, sourceId) {
            const el = document.getElementById('price-display');
            const srcEl = document.getElementById('price-source');
            const oldPrice = parseFloat(el.innerText.replace('$','')) || 0;
            el.innerText = `$${price.toFixed(4)}`;
            srcEl.innerText = `SRC: ${sourceId}`; srcEl.style.color = "#00ff00";
            el.style.color = price > oldPrice ? '#00ff00' : (price < oldPrice ? '#ff5555' : 'white');
        }

        function startRedundantPriceEngine() {
            fetchPrice();
            priceInterval = setInterval(fetchPrice, 8000); 
        }

        function startXRPL() {
            socket = new WebSocket('wss://s1.ripple.com');
            socket.onopen = () => socket.send(JSON.stringify({command:"subscribe", streams:["transactions", "ledger"]}));
            socket.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(d.type==='transaction') handleTx(d.transaction);
                if(d.type==='ledgerClosed') document.getElementById('ledger-display').innerText = d.ledger_index;
            };
        }

        function handleTx(tx) {
            if (isPaused || tx.TransactionType!=='Payment' || typeof tx.Amount!=='string') return;
            const amt = parseInt(tx.Amount)/1000000;
            let nameFrom = ENTITIES[tx.Account] || null;
            let nameTo = ENTITIES[tx.Destination] || null;
            const hasTag = tx.DestinationTag !== undefined;
            const isWhale = amt >= 1000000;
            let color = "text-green-500", tags = "";

            if(isWhale) { color = "text-yellow-400"; tags += `<span class="tag-pill tag-whale">WHALE</span>`; }
            if(hasTag) { tags += `<span class="tag-pill tag-exchange">TAG:${tx.DestinationTag}</span>`; }
            if(watchlist.includes(tx.Account) || watchlist.includes(tx.Destination)) { color = "text-red-500 font-bold"; showToast("TARGET DETECTED"); }

            const dispFrom = nameFrom ? `<span class="entity-name">${nameFrom}</span>` : tx.Account.substring(0,4)+'...';
            const dispTo = nameTo ? `<span class="entity-name">${nameTo}</span>` : tx.Destination.substring(0,4)+'...';

            const row = document.createElement('div');
            row.className = "tx-row";
            row.innerHTML = `
                <div class="row-top ${color}">
                    <div class="flex items-center gap-2"><span class="font-bold text-sm">${amt.toLocaleString()} XRP</span>${tags}</div>
                    <div class="text-[10px] font-mono text-gray-500">${new Date().toLocaleTimeString()}</div>
                </div>
                <div class="flex justify-between text-[11px] font-mono text-gray-400"><span>${dispFrom} ➔ ${dispTo}</span></div>
                <div class="btn-row">
                    <button class="action-btn" onclick="openScan('${tx.hash}')">SCAN</button>
                    <button class="action-btn" onclick="copyHash('${tx.hash}')">COPY</button>
                    <button class="action-btn" onclick='saveCase(${JSON.stringify({hash:tx.hash, amt, from:dispFrom, to:dispTo})})'>SAVE</button>
                </div>`;
            const feed = document.getElementById('feed');
            feed.prepend(row);
            if(feed.children.length > 30) feed.lastChild.remove();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('toast-show');
            setTimeout(() => t.classList.remove('toast-show'), 2000);
        }
        function openScan(h) { window.open(`https://xrpscan.com/tx/${h}`, '_blank'); }
        function copyHash(h) { navigator.clipboard.writeText(h); showToast("HASH COPIED"); }
        function switchView(id) {
            document.querySelectorAll('.view-panel').forEach(e => e.classList.remove('active'));
            document.getElementById('view-'+id).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
            event.target.classList.add('active');
        }
        function addWatch() {
            const v = document.getElementById('watch-input').value;
            if(v) { watchlist.push(v); renderWatch(); document.getElementById('watch-input').value=''; showToast("TRACKING ACTIVE"); }
        }
        function renderWatch() {
            document.getElementById('watch-list').innerHTML = watchlist.map((w,i) => `
                <div class="flex justify-between p-3 bg-green-900/20 border-b border-green-900">
                    <span class="font-mono text-xs text-green-300 truncate w-48">${w}</span>
                    <button onclick="watchlist.splice(${i},1);renderWatch()" class="text-red-500 font-bold">X</button>
                </div>`).join('');
        }
        function saveCase(d) { if(!cases.some(c=>c.hash===d.hash)) { cases.push(d); renderCases(); showToast("EVIDENCE SECURED"); } }
        function renderCases() {
            document.getElementById('case-list').innerHTML = cases.map(c => `
                <div class="p-3 border-l-2 border-yellow-500 bg-yellow-900/10 mb-1">
                    <div class="flex justify-between font-bold text-yellow-400 text-xs"><span>${c.amt.toLocaleString()} XRP</span><span class="text-[10px] text-gray-500 font-mono">${c.hash.substring(0,8)}...</span></div>
                    <div class="text-[10px] text-gray-400 mt-1">${c.from} -> ${c.to}</div>
                </div>`).join('');
        }
        function clearCases() { cases=[]; renderCases(); showToast("LOCKER CLEARED"); }
        function exportJSON() {
            const a = document.createElement('a');
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cases));
            a.download = "sentinel_cases.json";
            a.click();
        }
        init3D();
    </script>
</body>
</html>
