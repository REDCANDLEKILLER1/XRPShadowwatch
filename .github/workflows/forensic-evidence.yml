name: Private forensic evidence
on:
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [market, export, both]
        default: both
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '43 6 * * *'
  push:
    branches: [agent/forensic-patterns-20261009]
    paths: ['src/db/forensic-*.js', 'scripts/forensic-*.js', 'scripts/market-*.js', '.github/workflows/forensic-evidence.yml']
permissions:
  contents: read
# Share the storage writer lane with the master backup; capacity checks cannot race.
concurrency:
  group: shadowwatch-private-r2-backup
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'REDCANDLEKILLER1/XRPShadowwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Forensic and storage safeguards
        id: safeguards
        run: |
          node scripts/forensic-patterns.test.js
          node scripts/forensic-report.test.js
          node scripts/market-evidence.test.js
          node scripts/storage-master-backup.test.js
          node scripts/r2-master-backup.test.js
      - name: Collect public market sample into private R2
        if: github.event_name == 'push' || github.event.schedule == '7,22,37,52 * * * *' || inputs.job == 'market' || inputs.job == 'both'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/market-evidence.js
      - name: Independent backup, restore, and forensic export
        if: always() && !cancelled() && steps.safeguards.outcome == 'success' && (github.event_name == 'push' || github.event.schedule == '43 6 * * *' || inputs.job == 'export' || inputs.job == 'both')
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SHADOWWATCH_EVIDENCE_TOKEN: ${{ secrets.SHADOWWATCH_EVIDENCE_TOKEN }}
        run: node scripts/forensic-backup.js "$RUNNER_TEMP/forensic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      # No public Actions artifact contains private evidence. No source prune,
      # automatic admission, wallet signing, or XRPL transaction submission.
