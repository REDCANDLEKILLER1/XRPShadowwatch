name: Agent one-shot Aug 20 wallet promotions

on:
  push:
    branches:
      - agent/aug20-report-wallet-promotions
    paths:
      - .github/workflows/agent-one-shot-aug20-wallets.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aug20-report-wallet-promotions
          fetch-depth: 0

      - name: Promote all Aug 20 report-approved ADD wallets
        shell: python
        run: |
          from pathlib import Path

          promos = [
            ('rLG9Vpi3xLgfkzAfPkL9AJmD433DY7MoJk','LARGE_RECV_rLG9Vp','discovered_receiver','10318146','SW-20260820-FP7RI'),
            ('rhhB3igjitCmsN3PLh5zAgUuYvHJD8mJdd','SPLITTER_rhhB3i','next_hop_splitter','11178122','SW-20260820-FP7RI'),
            ('rBpFQot2zM5kpEz8mQ1P76i5EU5ZzDEBC4','SPLITTER_rBpFQo','next_hop_splitter','null','SW-20260820-FP7RI'),
            ('rML7EMb8QoaN8BraqHHdWZzSU4nReYRR9w','LARGE_RECV_rML7EM','discovered_receiver','8700062','SW-20260820-FP7RI'),
            ('r4x919MCsHKknPJMSt87g7tjMdwwo9wk6K','SPLITTER_r4x919','next_hop_splitter','4','SW-20260820-X5I20'),
            ('rNAQWcAYTbgC6wvdWLCa6su7VRsepiarTR','SPLITTER_rNAQWc','next_hop_splitter','7650','SW-20260820-ABSQ7'),
            ('rnrqyM7kS6wmC5demJm9vrfdN2vLgS8LfY','EXOUT_RECV_rnrqyM','discovered_receiver','1149480','SW-20260820-BP7EU'),
            ('rDHYrdu78ZU3qhiKttB7z73GJYpSQFMVHj','WHALE_RECV_rDHYrd','discovered_whale','52000000','SW-20260820-4OGEM'),
            ('rUkxsGUE3E7AUngmwRT46uGwRDJ8pa5L7s','WHALE_RECV_rUkxsG','discovered_whale','52000000','SW-20260820-4OGEM'),
          ]

          p = Path('src/brief/17-report-scan-tuning-20260816.js')
          s = p.read_text(encoding='utf-8')
          if "var VERSION = '2026.08.19.1';" in s:
            s = s.replace("var VERSION = '2026.08.19.1';", "var VERSION = '2026.08.20.1';", 1)
          anchor = """    {
                address: 'rDHyd2wTXnoT1MTvCigLGpm8o7WdhE5mGi',
                label: 'LARGE_RECV_rDHyd2',
                cat: 'discovered_receiver',
                balance_xrp_observed: 4225574.019047,
                source_report: 'SW-20260817-P5N3V'
              }
          """.replace('            ','')
          if anchor not in s:
            raise SystemExit('17 promotion anchor not found')
          blocks = []
          for address,label,cat,balance,source in promos:
            if address in s:
              continue
            blocks.append("""    {
              address: '%s',
              label: '%s',
              cat: '%s',
              balance_xrp_observed: %s,
              source_report: '%s'
            }""" % (address,label,cat,balance,source))
          if blocks:
            s = s.replace(anchor, anchor.rstrip() + ',\n' + ',\n'.join(blocks) + '\n', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/build-hvt-roster.js')
          s = p.read_text(encoding='utf-8')
          anchor = "  { handle: 'LARGE_RECV_rDHyd2', address: 'rDHyd2wTXnoT1MTvCigLGpm8o7WdhE5mGi', cat: 'discovered_receiver' }\n"
          if anchor not in s:
            raise SystemExit('roster promotion anchor not found')
          rows = []
          for address,label,cat,_,_ in promos:
            if address in s:
              continue
            rows.append("  { handle: '%s', address: '%s', cat: '%s' }" % (label,address,cat))
          if rows:
            s = s.replace(anchor, anchor.rstrip() + ',\n' + ',\n'.join(rows) + '\n', 1)
          p.write_text(s, encoding='utf-8')

      - name: Regenerate shared HVT roster
        run: node scripts/build-hvt-roster.js 2026-08-20

      - name: Verify all nine promotions in both engines
        run: |
          node - <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const addrs=[
            'rLG9Vpi3xLgfkzAfPkL9AJmD433DY7MoJk','rhhB3igjitCmsN3PLh5zAgUuYvHJD8mJdd',
            'rBpFQot2zM5kpEz8mQ1P76i5EU5ZzDEBC4','rML7EMb8QoaN8BraqHHdWZzSU4nReYRR9w',
            'r4x919MCsHKknPJMSt87g7tjMdwwo9wk6K','rNAQWcAYTbgC6wvdWLCa6su7VRsepiarTR',
            'rnrqyM7kS6wmC5demJm9vrfdN2vLgS8LfY','rDHYrdu78ZU3qhiKttB7z73GJYpSQFMVHj',
            'rUkxsGUE3E7AUngmwRT46uGwRDJ8pa5L7s'
          ];
          const tuning=fs.readFileSync('src/brief/17-report-scan-tuning-20260816.js','utf8');
          for(const a of addrs) if(!tuning.includes(a)) throw new Error('missing report promotion '+a);
          const ctx={window:{}}; vm.createContext(ctx); vm.runInContext(fs.readFileSync('src/shared/hvt-roster.js','utf8'),ctx);
          const roster=new Set(ctx.window.SW_HVT_ROSTER.targets.map(t=>t.address));
          for(const a of addrs) if(!roster.has(a)) throw new Error('missing HVT target '+a);
          if(ctx.window.SW_HVT_ROSTER.stats.rejected_invalid!==0) throw new Error('invalid roster address rejected');
          console.log('verified 9/9 report promotions; HVT targets='+roster.size);
          NODE

      - name: Parse checks
        run: npm run check

      - name: Commit promotions and remove one-shot helper
        run: |
          rm .github/workflows/agent-one-shot-aug20-wallets.yml
          git config user.name "ShadowWatch Builder"
          git config user.email "builder@users.noreply.github.com"
          git add src/brief/17-report-scan-tuning-20260816.js scripts/build-hvt-roster.js src/shared/hvt-roster.js .github/workflows/agent-one-shot-aug20-wallets.yml
          git commit -m "chore: promote Aug 20 report-approved wallets"
          git push origin HEAD:agent/aug20-report-wallet-promotions
