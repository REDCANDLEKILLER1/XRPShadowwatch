name: pr85-stale-window-followup
on:
  push:
    branches: [agent/pr83-preview-memory-repair]
    paths: [.github/pr85-stale-window.cjs, .github/workflows/pr85-stale-window.yml]
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow stale-window patch
        run: node .github/pr85-stale-window.cjs
      - name: Gate
        run: |
          node scripts/run-tests.js --only preview
          node scripts/run-tests.js --only syntax
      - name: Commit tested patch and remove bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/pr83-preview-memory-repair
          git rm .github/pr85-stale-window.cjs .github/workflows/pr85-stale-window.yml
          git add api/delta.js src/brief/45-delta-evidence-index-20260911.js src/brief/17-report-scan-tuning-20260816.js scripts/preview-no-direct-xrpl-fallback.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: mark stale stored preview windows partial'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/agent/pr83-preview-memory-repair
